# Local LAN preview on PC2 (Docker host). Does NOT replace Hostinger production.
# Production still deploys from GitHub. This stack is for fast edit → preview.
#
# Usage on the host (C:\hosted\asoldi):
#   docker compose -f docker-compose.lan.yml up -d --build
#
# URLs (from any PC on the LAN):
#   Site:             http://192.168.68.92:3200
#   API:              http://192.168.68.92:3201
#   Public previews:  https://asoldi.com/previews
#   Client preview:   https://asoldi.com/sales-preview/<sales-client-id>/
#   Website Maker:    http://192.168.68.92:3000
services:
  api:
    image: node:20-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev:api"
    ports:
      - "3201:3001"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      PORT: "3001"
      NODE_ENV: development
      APP_URL: http://192.168.68.92:3200
      # Point Asoldi sales / maker integration at the LAN website-creator.
      WEBSITE_MAKER_LOCAL_URL: http://192.168.68.92:3000
      WEBSITE_MAKER_BASE_URL: http://192.168.68.92:3000
      PROD_ADMIN_URL: https://asoldi.com
      SALES_PREVIEW_PUBLIC_BASE: https://asoldi.com
      SALES_PREVIEW_PUSH_URL: https://asoldi.com/api/admin/sales/maker-preview-push
      CLIENT_SOCIAL_DEV_MODE: "1"
      # Auto-publish every linked Maker site to https://asoldi.com/sales-preview
      # every few minutes (browsers cannot copy HTTP LAN -> HTTPS themselves).
      # Uses PROD_ADMIN_USERNAME/PROD_ADMIN_PASSWORD from .env when set.
      LAN_PREVIEW_AUTOPUBLISH: "1"
      # This box is not Hostinger, so hub safe mode is on (email to the outbox, external
      # writes blocked, egress allowlist). Let through only what the LAN preview needs:
      # the asoldi.com preview push and the Maker on the LAN. See docs/safe-mode.md.
      HUB_SAFE_MODE_ALLOW: "prodPublish,lan"
    volumes:
      - .:/app
      - asoldi_node_modules:/app/node_modules
    restart: unless-stopped

  web:
    image: node:20-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3200:3000"
    environment:
      NODE_ENV: development
      DISABLE_HMR: "false"
      API_PROXY_TARGET: http://api:3001
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - asoldi_node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  asoldi_node_modules:
